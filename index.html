<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permission Prompt Focus Test</title>
  <style>
    * { box-sizing: border-box; }
    /* Fill the window: controls at the top, log takes the remaining space and
       scrolls. The log's min-height makes the document scroll instead on very
       small screens (e.g. phone landscape). The bottom padding leaves room for
       the fixed footer, so it never covers the log even when scrolled. */
    body {
      margin: 0;
      padding: 16px 16px calc(40px + env(safe-area-inset-bottom));
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    .controls { flex-shrink: 0; width: 100%; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { font-size: 14px; margin: 0 0 12px; color: #444; }
    .states {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .state {
      flex: 1;
      padding: 16px 8px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      background: #e53935;
      color: #fff;
    }
    .state.on { background: #43a047; }
    .state.off { background: #9e9e9e; }
    .state span { display: block; font-weight: 400; font-size: 13px; margin-top: 4px; }
    .buttons { display: flex; gap: 8px; margin-bottom: 12px; }
    button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      background: #1e88e5;
      color: #fff;
    }
    button.secondary { background: #757575; }
    button:disabled { opacity: 0.6; }
    input {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #bdbdbd;
      border-radius: 8px;
    }
    #log {
      /* Zero basis so log content never grows the page; it scrolls instead */
      flex: 1 1 0;
      min-height: 150px;
      overflow-y: auto;
      padding: 8px;
      background: #111;
      color: #ddd;
      font: 12px/1.4 ui-monospace, monospace;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .event { color: #ffd54f; }
    .poll { color: #9e9e9e; }
    .perm { color: #4fc3f7; }
    .motion { color: #ce93d8; }
    .footer {
      position: fixed;
      left: calc(16px + env(safe-area-inset-left));
      bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex;
      gap: 4px;
      z-index: 1;
    }
    .footer .state {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .footer .state span { display: inline; margin: 0 0 0 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="controls">
  <h1>Permission prompt focus test</h1>
  <p>Tap "Request geolocation", respond to the prompt, then watch whether focus returns without another tap.</p>

  <div class="buttons">
    <button id="geo">Request geolocation</button>
    <button id="motion-toggle">Enable motion</button>
  </div>

  <div class="states">
    <div class="state" data-state="visibility">Visibility<span>-</span></div>
    <div class="state" data-state="focus">Focus<span>-</span></div>
    <div class="state off" data-state="motion">Motion<span>off</span></div>
  </div>

  <div class="buttons">
    <button id="delay-toggle" class="secondary">Delay: off</button>
    <button id="poll-toggle" class="secondary">Polling: off</button>
    <button id="clear" class="secondary">Clear log</button>
  </div>

  <input id="text" type="text" placeholder="Tap here to type while the prompt opens">
  </div>

  <div id="log"></div>

  <div class="footer">
    <div class="state" data-state="visibility">Vis<span>-</span></div>
    <div class="state" data-state="focus">Focus<span>-</span></div>
    <div class="state off" data-state="motion">Motion<span>off</span></div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const start = performance.now();

    function log(kind, msg) {
      const t = ((performance.now() - start) / 1000).toFixed(3).padStart(8);
      const line = document.createElement('div');
      line.className = kind;
      line.textContent = `${t}s [${kind}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Updates both the main state box and the footer pill.
    // status: 'on' (green), 'off' (grey) or anything else (red)
    function setState(name, status, text) {
      document.querySelectorAll(`[data-state="${name}"]`).forEach((el) => {
        el.classList.toggle('on', status === 'on');
        el.classList.toggle('off', status === 'off');
        el.querySelector('span').textContent = text;
      });
    }

    function render() {
      const visible = document.visibilityState === 'visible';
      const focused = document.hasFocus();
      setState('visibility', visible ? 'on' : 'red', document.visibilityState);
      setState('focus', focused ? 'on' : 'red', String(focused));
      return { visibility: document.visibilityState, hasFocus: focused };
    }

    function onEvent(e) {
      const s = render();
      log('event', `${e.type} -> visibilityState=${s.visibility} hasFocus()=${s.hasFocus}`);
    }

    window.addEventListener('focus', onEvent);
    window.addEventListener('blur', onEvent);
    document.addEventListener('visibilitychange', onEvent);

    const textInput = document.getElementById('text');
    textInput.addEventListener('focus', () => log('event', 'text input focus'));
    textInput.addEventListener('blur', () => log('event', 'text input blur'));

    function poll() {
      const s = render();
      log('poll', `visibilityState=${s.visibility} hasFocus()=${s.hasFocus}`);
    }

    let pollId = null;
    const pollToggle = document.getElementById('poll-toggle');
    pollToggle.addEventListener('click', () => {
      if (pollId) {
        clearInterval(pollId);
        pollId = null;
      } else {
        pollId = setInterval(poll, 1000);
      }
      pollToggle.textContent = `Polling: ${pollId ? 'on' : 'off'}`;
    });

    let motionCount = 0;
    let motionRate = 0;
    let motionId = null;
    const motionToggle = document.getElementById('motion-toggle');

    function onMotion() {
      motionCount++;
    }

    function measureMotion() {
      const rate = motionCount;
      motionCount = 0;
      if ((rate > 0) !== (motionRate > 0)) {
        const s = render();
        log('motion', `devicemotion ${rate > 0 ? 'started' : 'stopped'} (${rate}/s) -> visibilityState=${s.visibility} hasFocus()=${s.hasFocus}`);
      }
      motionRate = rate;
      setState('motion', rate > 0 ? 'on' : 'red', `${rate}/s`);
    }

    async function enableMotion() {
      // iOS needs explicit permission; Android Chrome doesn't have this method
      if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        try {
          const result = await DeviceMotionEvent.requestPermission();
          log('perm', `DeviceMotionEvent.requestPermission -> ${result}`);
        } catch (err) {
          log('perm', `DeviceMotionEvent.requestPermission failed: ${err.message}`);
        }
      }
      window.addEventListener('devicemotion', onMotion);
      motionId = setInterval(measureMotion, 1000);
      setState('motion', 'red', '0/s');
      motionToggle.textContent = 'Disable motion';
      log('motion', `devicemotion listener added (userActivation.hasBeenActive=${navigator.userActivation?.hasBeenActive})`);
    }

    function disableMotion() {
      window.removeEventListener('devicemotion', onMotion);
      clearInterval(motionId);
      motionId = null;
      motionCount = motionRate = 0;
      setState('motion', 'off', 'off');
      motionToggle.textContent = 'Enable motion';
      log('motion', 'devicemotion listener removed');
    }

    motionToggle.addEventListener('click', () => {
      if (motionId) disableMotion();
      else enableMotion();
    });

    const geoButton = document.getElementById('geo');
    const delayToggle = document.getElementById('delay-toggle');
    const geoDelay = 5;
    let delayGeo = false;

    delayToggle.addEventListener('click', () => {
      delayGeo = !delayGeo;
      delayToggle.textContent = `Delay: ${delayGeo ? `${geoDelay}s` : 'off'}`;
    });

    function requestGeolocation() {
      const s = render();
      log('perm', `requesting geolocation -> visibilityState=${s.visibility} hasFocus()=${s.hasFocus} userActivation.isActive=${navigator.userActivation?.isActive}`);
      navigator.geolocation.getCurrentPosition(
        () => log('perm', 'geolocation success'),
        (err) => log('perm', `geolocation error ${err.code}: ${err.message}`),
        { maximumAge: 0, timeout: 30000 }
      );
    }

    geoButton.addEventListener('click', () => {
      if (!delayGeo) {
        requestGeolocation();
        return;
      }
      geoButton.disabled = true;
      log('perm', `requesting geolocation in ${geoDelay}s`);
      let remaining = geoDelay;
      geoButton.textContent = `Requesting in ${remaining}s`;
      const countdownId = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          geoButton.textContent = `Requesting in ${remaining}s`;
          return;
        }
        clearInterval(countdownId);
        geoButton.disabled = false;
        geoButton.textContent = 'Request geolocation';
        requestGeolocation();
      }, 1000);
    });

    document.getElementById('clear').addEventListener('click', () => {
      logEl.textContent = '';
    });

    log('event', `load -> UA=${navigator.userAgent}`);
    render();
  </script>
</body>
</html>
