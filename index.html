<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permission Prompt Focus Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    .controls { max-width: 480px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { font-size: 14px; margin: 0 0 12px; color: #444; }
    .states {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .state {
      flex: 1;
      padding: 16px 8px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      background: #e53935;
      color: #fff;
    }
    .state.on { background: #43a047; }
    .state.off { background: #9e9e9e; }
    .state span { display: block; font-weight: 400; font-size: 13px; margin-top: 4px; }
    .buttons { display: flex; gap: 8px; margin-bottom: 12px; }
    button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      background: #1e88e5;
      color: #fff;
    }
    button.secondary { background: #757575; }
    #log {
      height: 50vh;
      overflow-y: auto;
      padding: 8px;
      background: #111;
      color: #ddd;
      font: 12px/1.4 ui-monospace, monospace;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .event { color: #ffd54f; }
    .poll { color: #9e9e9e; }
    .perm { color: #4fc3f7; }
    .motion { color: #ce93d8; }
  </style>
</head>
<body>
  <div class="controls">
  <h1>Permission prompt focus test</h1>
  <p>Tap "Request geolocation", respond to the prompt, then watch whether focus returns without another tap.</p>

  <div class="states">
    <div id="visibility" class="state">Visibility<span id="visibility-value">-</span></div>
    <div id="focus" class="state">Focus<span id="focus-value">-</span></div>
    <div id="motion" class="state off">Motion<span id="motion-value">off</span></div>
  </div>

  <div class="buttons">
    <button id="geo">Request geolocation</button>
    <button id="motion-toggle">Enable motion</button>
  </div>

  <div class="buttons">
    <button id="poll-toggle" class="secondary">Polling: on</button>
    <button id="clear" class="secondary">Clear log</button>
  </div>
  </div>

  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    const start = performance.now();

    function log(kind, msg) {
      const t = ((performance.now() - start) / 1000).toFixed(3).padStart(8);
      const line = document.createElement('div');
      line.className = kind;
      line.textContent = `${t}s [${kind}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function render() {
      const visible = document.visibilityState === 'visible';
      const focused = document.hasFocus();
      document.getElementById('visibility').classList.toggle('on', visible);
      document.getElementById('visibility-value').textContent = document.visibilityState;
      document.getElementById('focus').classList.toggle('on', focused);
      document.getElementById('focus-value').textContent = String(focused);
      return { visibility: document.visibilityState, hasFocus: focused };
    }

    function onEvent(e) {
      const s = render();
      log('event', `${e.type} -> visibilityState=${s.visibility} hasFocus()=${s.hasFocus}`);
    }

    window.addEventListener('focus', onEvent);
    window.addEventListener('blur', onEvent);
    document.addEventListener('visibilitychange', onEvent);

    function poll() {
      const s = render();
      log('poll', `visibilityState=${s.visibility} hasFocus()=${s.hasFocus}`);
    }

    let pollId = setInterval(poll, 1000);
    const pollToggle = document.getElementById('poll-toggle');
    pollToggle.addEventListener('click', () => {
      if (pollId) {
        clearInterval(pollId);
        pollId = null;
      } else {
        pollId = setInterval(poll, 1000);
      }
      pollToggle.textContent = `Polling: ${pollId ? 'on' : 'off'}`;
    });

    let motionCount = 0;
    let motionRate = 0;
    let motionId = null;
    const motionToggle = document.getElementById('motion-toggle');

    function onMotion() {
      motionCount++;
    }

    function measureMotion() {
      const rate = motionCount;
      motionCount = 0;
      if ((rate > 0) !== (motionRate > 0)) {
        const s = render();
        log('motion', `devicemotion ${rate > 0 ? 'started' : 'stopped'} (${rate}/s) -> visibilityState=${s.visibility} hasFocus()=${s.hasFocus}`);
      }
      motionRate = rate;
      document.getElementById('motion').classList.toggle('on', rate > 0);
      document.getElementById('motion-value').textContent = `${rate}/s`;
    }

    async function enableMotion() {
      // iOS needs explicit permission; Android Chrome doesn't have this method
      if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        try {
          const result = await DeviceMotionEvent.requestPermission();
          log('perm', `DeviceMotionEvent.requestPermission -> ${result}`);
        } catch (err) {
          log('perm', `DeviceMotionEvent.requestPermission failed: ${err.message}`);
        }
      }
      window.addEventListener('devicemotion', onMotion);
      motionId = setInterval(measureMotion, 1000);
      document.getElementById('motion').classList.remove('off');
      document.getElementById('motion-value').textContent = '0/s';
      motionToggle.textContent = 'Disable motion';
      log('motion', `devicemotion listener added (userActivation.hasBeenActive=${navigator.userActivation?.hasBeenActive})`);
    }

    function disableMotion() {
      window.removeEventListener('devicemotion', onMotion);
      clearInterval(motionId);
      motionId = null;
      motionCount = motionRate = 0;
      document.getElementById('motion').classList.remove('on');
      document.getElementById('motion').classList.add('off');
      document.getElementById('motion-value').textContent = 'off';
      motionToggle.textContent = 'Enable motion';
      log('motion', 'devicemotion listener removed');
    }

    motionToggle.addEventListener('click', () => {
      if (motionId) disableMotion();
      else enableMotion();
    });

    document.getElementById('geo').addEventListener('click', () => {
      log('perm', 'requesting geolocation');
      navigator.geolocation.getCurrentPosition(
        () => log('perm', 'geolocation success'),
        (err) => log('perm', `geolocation error ${err.code}: ${err.message}`),
        { maximumAge: 0, timeout: 30000 }
      );
    });

    document.getElementById('clear').addEventListener('click', () => {
      logEl.textContent = '';
    });

    log('event', `load -> UA=${navigator.userAgent}`);
    render();
  </script>
</body>
</html>
